<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/global/menu.css">
    <link rel="stylesheet" href="/global/page/page.css">
    <link rel="stylesheet" href="/global/set_up_joueur/set_up_joueur.css">
    <link rel="stylesheet" href="skull_king.css">
    <title>skull king</title>
</head>
<body>
    <!-- Arrière-plan lumineux et bleuté (nécessaire pour voir le flou sur fond noir) -->
    <div id="full_body" class="glass_body">
        <div class="bg-glow glow1"></div>
        <div class="bg-glow glow2"></div>
        <div id="zone_de_préparation_pour_le_menu"></div>
        
        <div id="joueurs">
            <div id="tableau_joueur">
                
            </div>
            
            <button id="plus_de_joueurs">ajouter un joueur</button>
            <button id="commencer">débuter la partie</button>
        </div>

        <div id="tableau_score_global">
        </div>
        <div id="tableau_de_jeu_global">
            <div class="affichage_du_round"></div>
            <div id="tableau_de_jeu">
                <div class="ligne_tableau_de_jeu">
                    <div class="slot_tableau_de_jeu">joueur</div>
                    <div class="slot_tableau_de_jeu">pari</div>
                    <div class="slot_tableau_de_jeu">plis</div>
                    <div class="slot_tableau_de_jeu">14 couleur</div>
                    <div class="slot_tableau_de_jeu">14 noir</div>
                </div>
                
            </div>

            <button id="retour_paris" class="bouton_bas_de_bage">retour</button>
            <button id="valider_valeur" class="bouton_bas_de_bage">Valider les scores</button>


        </div>
        <div id="tableau_de_pari_global">
            <div class="affichage_du_round"></div>
            <div id="tableau_de_pari">
                <div class="ligne_tableau_de_pari">
                    <div class="slot_tableau_de_jeu">joueur</div>
                    <div class="slot_tableau_de_jeu">pari</div>
                </div>
            </div>
            <button id="retour_tableau" class="bouton_bas_de_bage">retour</button>
            <button id="valider_pari" class="bouton_bas_de_bage">Valider les paris</button>
        </div>
    </div>
</body>
</html>

<script src="/global/menu.js"></script>
<script src="/global/set_up_joueur/set_up_joueur.js"></script>
<script src="skull_king.js"></script>
