<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="skull_king.css">
    <title>skull king</title>
</head>
<body>
    <!-- Arrière-plan lumineux et bleuté (nécessaire pour voir le flou sur fond noir) -->
    <div id="full_body" class="glass_body">
        <div class="bg-glow glow1"></div>
        <div class="bg-glow glow2"></div>
        
        <div id="joueurs">
            <div id="tableau_joueur">
                <div class="ligne_tableau_joueur">
                    <div class="joueur_numero">1</div>
                    <div class="joueur_nom">
                        <input type="text" class="input_nom_joueur" value="test">
                    </div>
                    <button class="joueur_action"><img class="img_trash" src="trash.svg" alt=""></button>
                </div>
                <div class="ligne_tableau_joueur">
                    <div class="joueur_numero">2</div>
                    <div class="joueur_nom">
                        <input type="text" class="input_nom_joueur" value="nom">
                    </div>
                    <button class="joueur_action"><img class="img_trash" src="trash.svg" alt=""></button>
                </div>
                
                
            </div>
            
            <button id="plus_de_joueurs">ajouter un joueur</button>
            <button id="commencer">débuter la partie</button>
        </div>
    </div>
</body>
</html>
